<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10142b">
<title>AI Smart Study — Advanced Learning</title>
<style>
:root{--bg:#0b1020;--panel:#151c35;--panel2:#1b2443;--text:#f4f6ff;--muted:#aab4d2;--accent:#8b7cff;--cyan:#5bd6e7;--line:#2b3659;--ok:#55d6a3;--warn:#ffca6a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b2450 0,#0b1020 48%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}input,select,textarea{font-size:16px}button{cursor:pointer;border:0}header{position:sticky;top:0;z-index:5;background:#0c1122eF;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 15px;display:flex;align-items:center;justify-content:center}.brand{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900;font-size:25px;text-align:center}.logo{height:48px;width:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--cyan));font-size:25px}.topbtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:9px 12px;border-radius:12px}.wrap{max-width:1160px;margin:0 auto;padding:22px;width:100%}.hero{text-align:center;padding:30px;border:1px solid #414b78;border-radius:22px;background:linear-gradient(135deg,#292f64,#192344 60%,#17384a);box-shadow:0 14px 34px #0002}.hero h1{font-size:32px;margin:0 0 8px}.hero p{margin:0;color:#d2d9f7;line-height:1.5}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center}.chip{background:#111a35a8;border:1px solid #56628e;padding:6px 10px;border-radius:999px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}.stat strong{display:block;font-size:27px}.stat small{color:var(--muted)}.sectiontitle{margin:22px 0 12px;font-size:20px;font-weight:750;text-align:center}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:1050px;margin:0 auto}.tile{min-height:140px;text-align:center;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;transition:.15s}.tile:active{transform:scale(.98)}.tile .emoji{font-size:30px}.tile b{display:block;margin:7px 0 4px}.tile small{color:var(--muted);line-height:1.4}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px auto;max-width:1000px}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}select,input,textarea{width:100%;background:#0e1530;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}textarea{min-height:120px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.primary{background:linear-gradient(135deg,var(--accent),#5d9dff);color:white;border-radius:12px;padding:12px 16px;font-weight:700}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 14px}.answer{white-space:pre-wrap;line-height:1.65}.answer h3{margin:5px 0}.loading{color:var(--cyan)}.small{font-size:12px;color:var(--muted)}.record{padding:10px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.tag{display:inline-block;border-radius:999px;background:#28365e;padding:3px 8px;font-size:11px;color:#c9d5ff;margin-right:5px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 10px}.navrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.error{color:#ffb6b6}.quizq{background:#0e1530;border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.quizq h4{margin:0 0 10px;line-height:1.5}.quizopt{display:flex;align-items:flex-start;gap:9px;padding:9px;margin:5px 0;background:#18213e;border:1px solid #334165;border-radius:10px;cursor:pointer}.quizopt input{width:auto;margin-top:3px}.quizfeedback{margin-top:8px;font-size:14px;line-height:1.5;padding:10px;border-radius:10px;background:#18213e}.success{color:var(--ok)}.error{color:#ff9696}.quizopt.correct-option{border-color:#39b981;background:#153d32}.quizopt.wrong-option{border-color:#ef6b75;background:#46252d}.quiz-progress{position:sticky;top:70px;z-index:2;background:#111a35;border:1px solid var(--line);padding:10px 12px;border-radius:12px;margin:10px 0}.quiz-progress-track{height:7px;background:#2b3659;border-radius:8px;overflow:hidden;margin-top:7px}.quiz-progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .2s}@media(min-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:36px}.wrap{padding:26px}}@media(max-width:520px){.brand{font-size:22px}.logo{height:44px;width:44px}.quiz-progress{top:64px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{padding:10px 6px}.stat strong{font-size:19px}.formgrid{grid-template-columns:1fr}.hero{padding:19px 14px}.hero h1{font-size:25px}.wrap{padding:12px}.tile{min-height:120px;padding:12px}.card{padding:15px}.sectiontitle{font-size:18px}}
</style></head>
<body>
<header><div class="brand"><div class="logo">🎓</div><span>AI Smart Study</span></div></header>
<main class="wrap">
<section class="hero"><h1>आपका AI पढ़ाई साथी</h1><p>सीखें • समझें • अभ्यास करें • अपनी प्रगति देखें — एक ही जगह।</p><div class="chips"><span class="chip">📘 कक्षा 1–12</span><span class="chip">🤖 AI शिक्षक</span><span class="chip">📝 अभ्यास</span><span class="chip">📈 प्रगति</span></div></section>
<div class="stats"><div class="stat"><strong id="testsCount">0</strong><small>टेस्ट / अभ्यास</small></div><div class="stat"><strong id="qCount">0</strong><small>सवाल किए</small></div><div class="stat"><strong id="avgScore">—</strong><small>औसत स्कोर</small></div></div>
<section id="home"><div class="sectiontitle">📚 पढ़ाई शुरू करें</div><div class="tiles">
<button class="tile" onclick="openMode('question')"><span class="emoji">🤖</span><b>AI शिक्षक से पूछें</b><small>किसी भी सवाल का आसान हल</small></button>
<button class="tile" onclick="openMode('chapter')"><span class="emoji">📖</span><b>अध्याय समझें</b><small>सरल भाषा में पूरा टॉपिक</small></button>
<button class="tile" onclick="openMode('mcq')"><span class="emoji">📝</span><b>MCQ अभ्यास</b><small>विषय अनुसार प्रश्न और उत्तर</small></button>
<button class="tile" onclick="openMode('daily')"><span class="emoji">⏱️</span><b>डेली टेस्ट</b><small>5 सवालों का दैनिक अभ्यास</small></button>
<button class="tile" onclick="openMode('board')"><span class="emoji">🎯</span><b>बोर्ड परीक्षा तैयारी</b><small>महत्वपूर्ण प्रश्न एवं उत्तर</small></button>
<button class="tile" onclick="showProgress()"><span class="emoji">📊</span><b>मेरी प्रगति</b><small>रिकॉर्ड और अभ्यास इतिहास</small></button>
</div><div class="navrow"><button class="secondary" onclick="showProgress()">📊 प्रगति रिपोर्ट</button><button class="secondary" onclick="practiceWrong()">🔁 पिछला अभ्यास दोहराएं</button></div></section>
<section id="study" class="card hidden"><div class="sectiontitle" id="modeTitle">AI शिक्षक</div><div class="formgrid"><div><label>कक्षा</label><select id="grade"></select></div><div><label>विषय</label><select id="subject"><option>गणित</option><option>विज्ञान</option><option>हिंदी</option><option>अंग्रेज़ी</option><option>सामाजिक विज्ञान</option><option>भौतिक विज्ञान</option><option>रसायन विज्ञान</option><option>जीव विज्ञान</option><option>सामान्य ज्ञान</option></select></div><div><label>उत्तर की भाषा</label><select id="language"><option>हिंदी</option><option>English</option><option>Hinglish</option></select></div></div><label id="promptLabel" style="margin-top:12px">अपना सवाल लिखें</label><textarea id="prompt" placeholder="यहां सवाल या विषय लिखें..."></textarea><div class="actions"><button class="primary" id="submitBtn" onclick="submitStudy()">✨ AI से जवाब पाएं</button><button class="secondary" onclick="showHome()">वापस</button></div><div id="output" class="card hidden answer"></div></section>
<section id="quizBox" class="card hidden"><div class="sectiontitle">📝 इंटरैक्टिव टेस्ट</div><div class="quiz-progress"><b id="quizProgressText">0 / 0 प्रश्न हल</b><div class="quiz-progress-track"><div class="quiz-progress-fill" id="quizProgressFill"></div></div></div><div id="quizQuestions"></div><div class="actions"><button class="primary" id="quizSubmit" onclick="checkQuiz()">✅ उत्तर जमा करें</button><button class="secondary" onclick="showHome()">होम</button></div><div id="quizResult" class="card hidden"></div></section>
<section id="progress" class="card hidden"><div class="sectiontitle">📈 आपकी प्रगति</div><div id="progressList"></div><div class="actions"><button class="secondary" onclick="showHome()">होम पर जाएं</button><button class="secondary" onclick="clearRecords()">रिकॉर्ड मिटाएं</button></div></section>
<div class="footer">AI Smart Study • सीखना आसान, अभ्यास नियमित</div></main>
<script>
const API_URL='https://rhahfromeeouetxlvmom.supabase.co/functions/v1/smart-service';
const STORE='aiSmartStudyAdvancedRecordsV1';let currentMode='question';let timer=null;let activeQuiz=[];let activeQuizTopic='';
const modes={question:{title:'🤖 AI शिक्षक से पूछें',label:'अपना सवाल लिखें',placeholder:'सवाल लिखें… उदाहरण: ओम का नियम समझाइए और उदाहरण दीजिए',task:'question'},chapter:{title:'📖 अध्याय समझें',label:'अध्याय का नाम',placeholder:'जैसे: विद्युत, प्रकाश, त्रिभुज…',task:'chapter'},mcq:{title:'📝 MCQ अभ्यास',label:'अध्याय / टॉपिक (वैकल्पिक)',placeholder:'जैसे: विद्युत (खाली छोड़ें तो पूरे विषय से)',task:'mcq'},daily:{title:'⏱️ डेली टेस्ट',label:'डेली टेस्ट',placeholder:'आज के 5 प्रश्न पूरे विषय से होंगे',task:'daily'},board:{title:'🎯 बोर्ड परीक्षा तैयारी',label:'बोर्ड परीक्षा की तैयारी',placeholder:'पूरे पाठ्यक्रम के महत्वपूर्ण प्रश्न, उत्तर और तैयारी योजना',task:'board'}};
function getRecords(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return []}}function saveRecords(a){localStorage.setItem(STORE,JSON.stringify(a));refreshStats()}
function refreshStats(){let r=getRecords();document.getElementById('testsCount').textContent=r.length;document.getElementById('qCount').textContent=r.reduce((s,x)=>s+(x.questions||1),0);let scores=r.filter(x=>typeof x.score==='number');document.getElementById('avgScore').textContent=scores.length?Math.round(scores.reduce((s,x)=>s+x.score,0)/scores.length)+'%':'—'}
function showHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('study').classList.add('hidden');document.getElementById('progress').classList.add('hidden');document.getElementById('quizBox').classList.add('hidden')}
function openMode(m){currentMode=m;let d=modes[m];document.getElementById('home').classList.add('hidden');document.getElementById('progress').classList.add('hidden');document.getElementById('quizBox').classList.add('hidden');document.getElementById('study').classList.remove('hidden');document.getElementById('modeTitle').textContent=d.title;document.getElementById('promptLabel').textContent=d.label;document.getElementById('prompt').placeholder=d.placeholder;document.getElementById('prompt').value='';document.getElementById('output').classList.add('hidden');let promptField=document.getElementById('prompt');promptField.style.display=(m==='daily'||m==='board')?'none':'block';document.getElementById('promptLabel').style.display=(m==='daily'||m==='board')?'none':'block';if(m==='daily')document.getElementById('submitBtn').textContent='🧪 5 प्रश्नों का टेस्ट शुरू करें';else if(m==='mcq')document.getElementById('submitBtn').textContent='📝 MCQ बनाएं';else if(m==='board')document.getElementById('submitBtn').textContent='🎯 बोर्ड तैयारी शुरू करें';else document.getElementById('submitBtn').textContent='✨ AI से जवाब पाएं';}
function showProgress(){document.getElementById('home').classList.add('hidden');document.getElementById('study').classList.add('hidden');document.getElementById('quizBox').classList.add('hidden');document.getElementById('progress').classList.remove('hidden');let r=getRecords().slice().reverse();let el=document.getElementById('progressList');if(!r.length){el.innerHTML='<p class="small">अभी कोई रिकॉर्ड नहीं। पढ़ाई या टेस्ट शुरू करें।</p>';return}el.innerHTML=r.map(x=>`<div class="record"><span class="tag">${esc(x.mode||'अभ्यास')}</span><span class="tag">कक्षा ${esc(x.grade||'')}</span><b>${esc(x.subject||'')}</b><div>${esc(x.topic||'')}</div><small>${esc(x.date||'')} • ${x.questions||1} प्रश्न</small></div>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseQuiz(text){
  const clean=text.replace(/```(?:json)?/gi,'').replace(/```/g,'').trim();
  try{let j=JSON.parse(clean);let arr=Array.isArray(j)?j:(j.questions||j.mcqs||[]);if(arr.length){return arr.map((x,i)=>{let options=x.options||x.choices||x.opts||[];if(!Array.isArray(options))options=Object.entries(options).map(([key,val])=>({key,text:val}));options=options.map((o,k)=>typeof o==='string'?{key:String.fromCharCode(65+k),text:o}:{key:String(o.key||o.label||String.fromCharCode(65+k)).replace(/[.)]/g,'').toUpperCase(),text:String(o.text||o.value||o.option||'')});let ans=String(x.answer||x.correctAnswer||x.correct||'').toUpperCase().replace(/[^A-D1-4]/g,'');if(/[1-4]/.test(ans))ans=String.fromCharCode(64+Number(ans));return{q:String(x.question||x.q||x.prompt||''),opts:options,answer:ans,exp:String(x.explanation||x.exp||'')}}).filter(x=>x.q&&x.opts.length>=4&&x.answer);}}catch(e){}
  const blocks=clean.split(/(?=(?:प्रश्न\s*)?\d+[.)、:])/i).map(x=>x.trim()).filter(Boolean);let parsed=[];
  for(const b of blocks){let lines=b.split(/\n/).map(x=>x.trim().replace(/^\*+|\*+$/g,'')).filter(Boolean);let qline=lines.find(x=>/^(?:प्रश्न\s*)?\d+[.)、:]/i.test(x));if(!qline)continue;
    let q=qline.replace(/^(?:प्रश्न\s*)?\d+[.)、: ]\s*/i,'');let opts=[];for(let line of lines){let m=line.match(/^([A-D]|[1-4])[.)、: ]\s*(.+)$/i);if(m)opts.push({key:/[1-4]/.test(m[1])?String.fromCharCode(64+Number(m[1])):m[1].toUpperCase(),text:m[2].replace(/^\*+|\*+$/g,'')});}
    let am=b.match(/(?:सही उत्तर|उत्तर|answer|correct answer)\s*[:：-]?\s*([A-D]|[1-4])/i);let answer=am?am[1].toUpperCase():'';if(/[1-4]/.test(answer))answer=String.fromCharCode(64+Number(answer));let exp=(b.match(/(?:व्याख्या|समझाइए|explanation)\s*[:：-]?\s*(.+)/i)||[])[1]||'';
    if(q&&opts.length>=4&&answer)parsed.push({q,opts,answer,exp});
  }return parsed;
}
function renderQuiz(questions){activeQuiz=questions;document.getElementById('study').classList.add('hidden');document.getElementById('quizBox').classList.remove('hidden');document.getElementById('quizResult').classList.add('hidden');document.getElementById('quizQuestions').innerHTML=questions.map((q,i)=>`<div class="quizq" data-q="${i}"><h4>${i+1}. ${esc(q.q)}</h4>${q.opts.map(o=>`<label class="quizopt"><input type="radio" name="q${i}" value="${esc(o.key)}"><span><b>${esc(o.key)}.</b> ${esc(o.text)}</span></label>`).join('')}</div>`).join('');document.getElementById('quizSubmit').disabled=false;document.getElementById('quizSubmit').style.display='';updateQuizProgress();document.querySelectorAll('#quizQuestions input[type=radio]').forEach(r=>r.addEventListener('change',updateQuizProgress));}
function updateQuizProgress(){let answered=0;activeQuiz.forEach((q,i)=>{if(document.querySelector(`input[name="q${i}"]:checked`))answered++;});let text=document.getElementById('quizProgressText');if(text)text.textContent=`${answered} / ${activeQuiz.length} प्रश्न हल`;let fill=document.getElementById('quizProgressFill');if(fill)fill.style.width=(activeQuiz.length?answered/activeQuiz.length*100:0)+'%';}
function retryQuiz(){openMode(currentMode);if(currentMode==='mcq')document.getElementById('prompt').value=activeQuizTopic;submitStudy();}
function checkQuiz(){if(!activeQuiz.length)return;let correct=0,answered=0;activeQuiz.forEach((q,i)=>{let chosen=document.querySelector(`input[name="q${i}"]:checked`);if(chosen)answered++;if(chosen&&q.answer&&chosen.value===q.answer)correct++;let box=document.querySelector(`[data-q="${i}"]`);box.querySelectorAll('.quizopt').forEach(label=>{let input=label.querySelector('input');input.disabled=true;if(input.value===q.answer)label.classList.add('correct-option');if(chosen&&input.value===chosen.value&&chosen.value!==q.answer)label.classList.add('wrong-option');});let feedback=box.querySelector('.quizfeedback');if(!feedback){feedback=document.createElement('div');feedback.className='quizfeedback';box.appendChild(feedback)}feedback.innerHTML=q.answer?`<b class="${chosen&&chosen.value===q.answer?'success':'error'}">${chosen&&chosen.value===q.answer?'✅ सही उत्तर!':'❌ सही उत्तर: '+esc(q.answer)}</b>${q.exp?'<div style="margin-top:5px">💡 '+esc(q.exp)+'</div>':''}`:'<span class="small">इस प्रश्न की answer key AI उत्तर में नहीं मिली।</span>';});let pct=activeQuiz.length?Math.round(correct/activeQuiz.length*100):0;let result=document.getElementById('quizResult');result.classList.remove('hidden');result.innerHTML=`<h3>🎉 आपका परिणाम</h3><p><b>${correct} / ${activeQuiz.length}</b> सही (${pct}%)</p><p>उत्तर दिए: ${answered}/${activeQuiz.length}</p><p>${pct>=80?'बहुत बढ़िया!':pct>=50?'अच्छा प्रयास, फिर अभ्यास करें।':'चिंता न करें—गलत उत्तरों को पढ़ें और दोबारा अभ्यास करें।'}</p><button class="primary" onclick="retryQuiz()">🔄 दोबारा टेस्ट दें</button><button class="secondary" onclick="showHome()" style="margin-left:8px">🏠 होम</button>`;document.getElementById('quizSubmit').disabled=true;document.getElementById('quizSubmit').style.display='none';let records=getRecords();records.push({mode:'इंटरैक्टिव '+(currentMode==='daily'?'डेली टेस्ट':'MCQ'),grade:grade.value,subject:document.getElementById('subject').value,topic:activeQuizTopic||'अभ्यास',questions:activeQuiz.length,score:pct,date:new Date().toLocaleString('hi-IN'),correct,answered});saveRecords(records);refreshStats();}
async function submitStudy(){let d=modes[currentMode],p=document.getElementById('prompt').value.trim();if((currentMode==='question'||currentMode==='chapter')&&!p){alert(currentMode==='question'?'अपना सवाल लिखें।':'अध्याय का नाम लिखें।');return}let out=document.getElementById('output'),btn=document.getElementById('submitBtn');out.classList.remove('hidden');out.innerHTML='<p class="loading">⏳ AI जवाब तैयार कर रहा है…</p>';btn.disabled=true;let gradeValue=document.getElementById('grade').value,subjectValue=document.getElementById('subject').value,languageValue=document.getElementById('language').value;let topic=currentMode==='mcq'?(p||'पूरे विषय के मुख्य अध्याय'):currentMode==='daily'?'पूरे विषय के पाठ्यक्रम':currentMode==='board'?'पूरे पाठ्यक्रम की बोर्ड परीक्षा तैयारी':p;let payload={task:d.task,mode:currentMode,grade:gradeValue,subject:subjectValue,language:languageValue,question:p,chapter:topic,topic:topic,numberOfQuestions:currentMode==='daily'?5:10};if(currentMode==='mcq'||currentMode==='daily'){activeQuizTopic=topic;let count=currentMode==='daily'?5:10;payload.question='कक्षा '+gradeValue+', विषय '+subjectValue+', टॉपिक: '+topic+'. केवल '+count+' MCQ बनाएं। '+(currentMode==='daily'?'पूरे विषय के सिलेबस से संतुलित दैनिक टेस्ट बनाएं। ':'टॉपिक अनुसार प्रश्न बनाएं। ')+'अध्याय की व्याख्या या नोट्स न दें। हर प्रश्न में ठीक 4 विकल्प A, B, C, D और एक सही उत्तर व छोटी व्याख्या हो। आउटपुट केवल JSON में दें, शीर्ष स्तर questions array हो, प्रत्येक item में question, options (A/B/C/D key-value object), answer (A/B/C/D), explanation fields हों। भाषा '+languageValue+' रखें।';payload.chapter=topic;payload.topic=topic;payload.quizFormat='json';payload.requireAnswerKey=true;}else if(currentMode==='board'){payload.question='कक्षा '+gradeValue+' '+subjectValue+' के पूरे पाठ्यक्रम की बोर्ड परीक्षा तैयारी कराएं। बिना अध्याय चुनवाए: syllabus overview, सबसे महत्वपूर्ण प्रश्न-उत्तर, short/long answers, तैयारी की रणनीति, revision schedule और परीक्षा में अंक बढ़ाने के सुझाव दें। भाषा '+languageValue+' रखें।';payload.chapter='पूरा पाठ्यक्रम';payload.topic='पूरा पाठ्यक्रम';}try{let resp=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let data=await resp.json();if(!resp.ok)throw new Error(data.error||data.message||'सर्वर त्रुटि '+resp.status);if(currentMode==='mcq'||currentMode==='daily'){let quizData=data.quiz||data.questions||data.result?.quiz||data.result?.questions;let txt=typeof quizData==='string'?quizData:quizData?JSON.stringify({questions:quizData}):data.answer??data.result??data.text??data.output??data.content??'';if(typeof txt!=='string')txt=JSON.stringify(txt);let parsed=parseQuiz(txt);if(parsed.length){renderQuiz(parsed);out.innerHTML='<p class="success">टेस्ट तैयार! नीचे प्रश्नों के उत्तर चुनें।</p>'; }else{out.innerHTML='<p class="error">AI ने प्रश्न-पत्र का सही प्रारूप नहीं भेजा। कृपया फिर से टेस्ट बनाएं। JSON कोड विद्यार्थियों को नहीं दिखाया गया।</p>';document.getElementById('study').classList.remove('hidden');}}else{let answer=data.answer??data.result??data.text??data.output??data.content??data;let txt=typeof answer==='string'?answer:JSON.stringify(answer,null,2);out.innerHTML=esc(txt).replace(/\n/g,'<br>');let rec=getRecords();rec.push({mode:d.title,grade:gradeValue,subject:subjectValue,topic:topic,questions:1,date:new Date().toLocaleString('hi-IN')});saveRecords(rec)}}catch(e){out.innerHTML='<p class="error">जवाब प्राप्त नहीं हुआ: '+esc(e.message)+'<br><small>कृपया इंटरनेट और Supabase smart-service Edge Function जांचें।</small></p>'}finally{btn.disabled=false}}

function practiceWrong(){let r=getRecords();if(!r.length){alert('पहले कुछ सवाल या टेस्ट करें।');return}let last=r[r.length-1];openMode('mcq');document.getElementById('prompt').value=last.topic||last.subject||''}
function clearRecords(){if(confirm('क्या सभी इस वेबसाइट के स्थानीय अभ्यास रिकॉर्ड मिटाएं?')){localStorage.removeItem(STORE);refreshStats();showProgress()}}
let grade=document.getElementById('grade');for(let i=1;i<=12;i++){let o=document.createElement('option');o.value=i;o.textContent='कक्षा '+i;if(i===10)o.selected=true;grade.appendChild(o)}refreshStats();
</script></body></html>
